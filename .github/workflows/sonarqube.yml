name: sonarqube
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # global.json pins the Microsoft.Testing.Platform runner, which does not speak
      # VSTest's data collector protocol -- the usual `dotnet test --collect:"XPlat Code
      # Coverage"` fails with a handshake error under it. coverlet.MTP (referenced by the
      # test project) is coverlet's native MTP extension; this invocation is what actually
      # writes an OpenCover file, verified locally before this workflow was added.
      - name: Run tests with coverage
        run: dotnet test --results-directory ./coverage -- --coverlet --coverlet-output-format opencover
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
